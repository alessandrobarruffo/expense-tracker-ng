server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html index.htm;

    # Compressione Gzip per performance ottimali
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/javascript;
    gzip_disable "MSIE [1-6]\.";

    # Gestione delle rotte SPA di Angular: qualsiasi rotta non trovata serve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache per gli asset statici con hash
    location ~* \.(?:ico|css|js|gif|jpe?g|png|woff2?|eot|ttf|svg)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Proxy inverso per le chiamate /api verso il backend di produzione (Azure)
    location /api/ {
        proxy_pass https://app-expensetracker.ambitiousmushroom-6077c4fb.italynorth.azurecontainerapps.io/api/;
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_set_header Host app-expensetracker.ambitiousmushroom-6077c4fb.italynorth.azurecontainerapps.io;
        proxy_set_header Origin https://app-expensetracker.ambitiousmushroom-6077c4fb.italynorth.azurecontainerapps.io;
        proxy_set_header Referer https://app-expensetracker.ambitiousmushroom-6077c4fb.italynorth.azurecontainerapps.io/;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_redirect off;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}

