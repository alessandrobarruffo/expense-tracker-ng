server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html index.htm;

    # Compressione Gzip per performance ottimali
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/javascript;
    gzip_disable "MSIE [1-6]\.";

    # Gestione delle rotte SPA di Angular: qualsiasi rotta non trovata serve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache per gli asset statici con hash
    location ~* \.(?:ico|css|js|gif|jpe?g|png|woff2?|eot|ttf|svg)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Proxy inverso per le chiamate /api verso il backend
    location /api/ {
        proxy_pass ${API_URL};
        proxy_http_version 1.1;

        # 1. Permette al router di Azure di consegnare la richiesta al backend corretto:
        proxy_set_header Host $proxy_host;

        # 2. Fa sapere al backend il vero dominio del browser :
        proxy_set_header X-Forwarded-Host $host;

        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}

