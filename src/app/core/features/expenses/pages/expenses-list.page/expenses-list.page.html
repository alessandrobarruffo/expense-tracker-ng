<div class="w-full h-full p-3">
  <p-button (click)="visible.set(true)" icon="pi pi-plus" aria-label="add expense"> </p-button>
</div>

<p-dialog header="Aggiungi Spesa" [modal]="true" [(visible)]="visible" [style]="{ width: '25rem' }">
  <span class="p-text-secondary block mb-5">Aggiungi una nuova spesa</span>
  <div class="flex flex-column items-center gap-4 mb-4">
    <label for="category" class="font-semibold w-24">Categoria</label>
    <p-select optionLabel="name" placeholder="Select a category" class="w-full" />
  </div>
  <div class="flex flex-column items-center gap-4 mb-8">
    <label for="email" class="font-semibold w-24">Price</label>
    <input pInputText type="number" id="price" class="flex-auto" autocomplete="off" />
  </div>
  <div class="flex justify-end gap-2">
    <p-button label="Cancel" severity="secondary" (click)="visible.set(false)"></p-button>
    <p-button label="Save" (click)="visible.set(false)"></p-button>
  </div>
</p-dialog>
